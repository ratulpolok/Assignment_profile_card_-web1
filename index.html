<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <article class="profile-card">
    <img class="avatar" src=" আল-বারাকা বিল্ডার্স.jpg" alt="Profile picture of Al- Baraka Builders">

    <h1 class="name">AL- Baraka Builders</h1>
    <p class="bio">Developer Company &amp;Interior designer</p>

    <section class="stats">
      <ul class="stats-list">
        <li class="stat-item"><strong>15K</strong> Followers</li>
        <li class="stat-item"><strong>150</strong> Following</li>
      </ul>
    </section>

    <button class="follow-btn" type="button">Follow</button>
  </article>

</body>
</html>
